<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Yalla 特色机制实验室</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#192b35;background:#f1f4f3}*{box-sizing:border-box}body{margin:0}header{background:#173f43;color:#fff;padding:25px max(18px,calc((100vw - 1100px)/2));}header a{color:#d7efee}header h1{margin:4px 0;font-size:25px}header p{line-height:1.6;color:#d5e2e2}.wrap{max-width:1100px;margin:24px auto;padding:0 18px}select{width:100%;font:inherit;padding:13px;border:1px solid #95b4b5;border-radius:7px;background:white}.row{display:flex;gap:12px;align-items:center;margin:20px 0}.row h2{flex:1;font-size:21px;margin:0}button{font:inherit;padding:11px 15px;border:1px solid #5d8b8d;border-radius:7px;background:#fff;color:#174b4e;cursor:pointer;min-height:44px}button:hover{background:#dfeeee}button:active{transform:translateY(1px)}#status,#strength{font-size:13px;color:#466b68}#loop{line-height:1.8}#board{background:#dfecea;border-left:4px solid #317f7d;padding:20px;margin-bottom:20px}.track{display:flex;gap:12px;align-items:center;margin:10px 0}.track progress,.track meter{flex:1;min-width:100px}.scene{font-size:23px;font-weight:700}.scene span{display:block;font-size:13px;font-weight:400;margin-top:10px}.participant{display:inline-block;padding:14px;margin:4px;border:1px solid #477c75;border-radius:5px}.out{opacity:.5;text-decoration:line-through}#state{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1px;background:#cad8d7;border:1px solid #cad8d7}.fact{padding:13px;background:#fff;overflow-wrap:anywhere}.fact small{display:block;color:#677d7b;font-size:12px}.fact strong{display:block;font-weight:550;margin-top:5px;font-size:15px;line-height:1.5}#actions{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}#error{color:#a12e24;min-height:24px}details{border-top:1px solid #bdd0cb;padding:16px 0;line-height:1.7}summary{cursor:pointer;font-weight:600}blockquote{font-size:13px;background:#e6ebe8;padding:12px;margin:5px 0;overflow-wrap:anywhere}#event-log{background:#fff;padding:15px 15px 15px 36px;max-height:240px;overflow:auto;line-height:1.8;font-size:14px}.note{color:#627570;font-size:13px;line-height:1.6}@media(max-width:600px){header{padding:20px 18px}.wrap{margin:18px auto}.row{align-items:flex-start}.row h2{font-size:18px}#state{grid-template-columns:repeat(2,minmax(0,1fr))}.fact strong{font-size:13px}#actions button{flex:1 1 44%;font-size:14px;padding:10px 7px}.scene{font-size:20px}}
</style><header><a href="./legacy/" id="legacy-link">原精选demo</a> · <a href="#evidence-panel" id="catalog-link">静态证据与目录边界</a><h1>Yalla · 特色机制实验室</h1><p>全部参与者、金币、等级、时间与奖励均为本地模拟。B是包体资源规则，C是入口候选；数值补齐与未知均可展开核对。</p></header><main class="wrap"><label for="feature-select">选择特色模块（12项）</label><select id="feature-select" data-testid="feature-select"></select><div class="row"><h2 id="title"></h2><button data-action="reset">重置局面</button></div><div id="strength"></div><p id="loop"></p><div id="board"></div><div id="status" role="status"></div><div id="error" role="alert"></div><section id="state" data-testid="state" aria-label="机制状态"></section><section id="actions" aria-label="可执行动作"></section><h3>事件轨迹</h3><ol id="event-log" data-testid="event-log"></ol><details open><summary>原规则与重构选择</summary><p id="rules"></p><p class="note">本地补齐：</p><p id="choices"></p></details><details><summary>仍未恢复 / 未验证</summary><ul id="unknowns"></ul></details><details id="evidence-panel"><summary>静态证据定位（没有执行原App）</summary><ul id="evidence"></ul></details></main><script type="module" src="ui.mjs"></script></html>
