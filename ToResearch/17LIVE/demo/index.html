<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>特色机制实验室</title><style>
:root{color-scheme:light;font-family:system-ui,sans-serif;color:#202e32;background:#eeeae1}*{box-sizing:border-box}body{margin:0}header{padding:24px 4vw;background:#163b3f;color:#fff}h1{margin:0 0 10px;font-size:28px}p{line-height:1.7}main{max-width:1250px;margin:auto;padding:24px;display:grid;grid-template-columns:1.1fr 1fr;gap:24px}section{padding:24px;background:#fff;border:1px solid #cbc9be;border-radius:10px}h2{font-size:21px}select{max-width:100%;padding:12px;font-size:16px}label{display:flex;flex-direction:column;gap:6px;font-size:13px}input{padding:9px;width:100%;border:1px solid #a1aba7;border-radius:4px}button{padding:12px 16px;border:0;border-radius:5px;background:#205d61;color:white;font-size:15px;cursor:pointer;min-height:44px}button:hover{background:#163b3f}.action{display:flex;gap:10px;align-items:end;padding:12px 0;border-bottom:1px solid #eee;flex-wrap:wrap}.action label{flex:1;min-width:100px}#parameters{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}pre{overflow:auto;font-size:13px;line-height:1.6;max-height:500px;background:#f3f5f0;padding:16px;white-space:pre-wrap;overflow-wrap:anywhere}#evidence{font-size:12px;overflow-wrap:anywhere;color:#4a5b58}.error{color:#b13228}.ok{color:#205d61}li{line-height:1.8}#feedback{padding:12px;background:#eeeae1;border-radius:5px}canvas{width:100%;max-width:400px}.card-preview{position:relative;height:220px;background:#e2ddd0;border-radius:10px;padding:12px}.card-preview span{font-size:60px}.seats{display:flex;gap:16px}.seats div{background:#ece8dc;padding:20px}.entry{padding:30px;text-align:center;background:#dfebdf;animation:entry .6s ease-out}@keyframes entry{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}a{color:inherit}@media(max-width:700px){main{grid-template-columns:1fr;padding:12px;gap:12px}section{padding:16px}header{padding:20px}h1{font-size:23px}.action{align-items:stretch}.action button{width:100%}}@media(prefers-reduced-motion:reduce){.entry{animation:none}}
</style></head><body><header><h1>17LIVE · 特色机制实验室</h1><p>本地账号、媒体、支付与后台模拟 · 所有参数不冒充原服务规则</p><select id="feature-select" data-testid="feature-select" aria-label="功能ID选择器"></select> <a href="./legacy/">旧版demo</a></header><main><section><h2 id="title"></h2><p id="loop"></p><h3>参与者动作</h3><div id="actions"></div><p id="feedback" role="status"></p><button data-action="reset">重置当前机制</button><div id="visual"></div><h3>本地显式参数</h3><p>数字阈值、题库与未恢复算法仅为可编辑重构选择；下一次动作读取参数。</p><div id="parameters"></div></section><section><h2>当前状态局面</h2><pre id="state" data-testid="state"></pre><h3>事件轨迹</h3><ol id="event-log" data-testid="event-log" aria-live="polite"></ol><h3>源规则</h3><ul id="rules"></ul><h3>尚未恢复 / 实验边界</h3><p id="limits"></p><p id="evidence"></p></section></main><script type="module" src="./ui.mjs"></script></body></html>
