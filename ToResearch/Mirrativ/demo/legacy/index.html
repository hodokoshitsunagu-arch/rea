<!doctype html><html lang="zh-CN"><meta charset="utf-8"><link rel="icon" href="data:,"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mirrativ 机制重构</title><style>body{margin:0;background:#0c1220;color:#edf1fa;font:17px/1.6 system-ui}main{max-width:1000px;margin:50px auto;padding:24px}header{border-bottom:1px solid #43536d;padding-bottom:24px}small{color:#93b7d9}h1{font-size:38px;line-height:1.2}.stage{background:#15263b;padding:30px;margin:28px 0;border-left:4px solid #7ac8a4}button{font:inherit;padding:12px 18px;background:#b9ead6;color:#10242e;border:0;border-radius:6px;margin:5px;cursor:pointer}button:hover{background:#fff}aside{color:#abbcd4}li{margin:8px 0}@media(max-width:600px){main{margin:12px auto}h1{font-size:29px}button{width:100%;margin:5px 0}}.boxes,.duo{display:flex;gap:20px;justify-content:space-around;flex-wrap:wrap;margin-bottom:24px}.box{width:68px;height:80px;border:2px solid #d9bb73;border-radius:12px;display:grid;place-items:center;font-size:30px;color:#f5d781}.duo>div{flex:1;min-width:170px;text-align:center}.avatar{display:inline-grid;place-items:center;width:70px;height:70px;border-radius:50%;background:#486078;font-size:30px;font-weight:700}progress{width:100%;height:18px;accent-color:#b9ead6}.stage h2{margin:10px 0} </style><main><header><small>Mirrativ · 静态包体研究 / 本地交互重构</small><h1>Emomo 联动 × 双侧游戏任务</h1><aside>直接证据：Collab事件族、Emomo Unity命令、LiveGameMission含player/viewer/coinBoost字段（REA）。邀请状态机与双方3次目标、奖励需双方达标为重构选择；未恢复游戏本体或服务端策略。</aside></header><section class="stage"><div id="visual"></div><div id="state"></div></section><nav id="actions"></nav><button id="reset">重置可重复场景</button><h2>事件轨迹</h2><ol id="history"></ol><p>仅本地模拟，无原始后台、RTC、支付或真实奖励。模型与UI分离，按钮无效时表示该事件不适用于当前状态。</p><a href="../ANALYSIS.md" style="color:#b9ead6">分析报告</a></main><script type="module">import {initial,reduce,actions,describe} from './model.mjs';let s=initial();const state=document.querySelector('#state'),history=document.querySelector('#history'),visual=document.querySelector('#visual');function render(){visual.innerHTML='<div class=duo><div><span class=avatar>H</span><p>主播 · Hana</p><progress max=3 value='+s.mission.player+'></progress><p>游戏任务</p></div><div><span class=avatar style="opacity:'+(s.phase==='connected'?1:0.4)+'">N</span><p>Emomo · Nao</p><progress max=3 value='+s.mission.viewer+'></progress><p>观众助力任务</p></div></div>';state.textContent=describe(s);history.replaceChildren(...s.history.map(t=>{const el=document.createElement('li');el.textContent=t;return el}))}for(const [event,label] of actions){const b=document.createElement('button');b.textContent=label;b.onclick=()=>{s=reduce(s,event);render()};document.querySelector('#actions').append(b)}document.querySelector('#reset').onclick=()=>{s=initial();render()};render();</script></html>
